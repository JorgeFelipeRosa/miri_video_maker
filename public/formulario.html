<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conte seu evento | Miriã Storymaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/css/base/reset.css">
    <style>
        /* ===== Tema aconchegante – eventos ===== */
        :root {
            --form-cream: #faf8f5;
            --form-blush: #f5e6e0;
            --form-warm: #e8d5c4;
            --form-gold: #b8860b;
            --form-gold-soft: #d4a84b;
            --form-text: #3d3a36;
            --form-text-soft: #6b6560;
            --form-border: rgba(184, 134, 11, 0.25);
            --form-shadow: 0 25px 50px -12px rgba(61, 58, 54, 0.15);
            --form-radius: 20px;
            --font-elegant: 'Cormorant Garamond', serif;
            --font-body: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--form-text);
            overflow-x: hidden;
        }

        /* ===== Fundo com imagens em transição ===== */
        .form-page {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem 3rem;
        }

        .bg-slides {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            animation: bgFade 20s ease-in-out infinite;
        }

        .bg-slide:nth-child(1) {
            background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1920');
            animation-delay: 0s;
        }
        .bg-slide:nth-child(2) {
            background-image: url('https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=1920');
            animation-delay: 5s;
        }
        .bg-slide:nth-child(3) {
            background-image: url('https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=1920');
            animation-delay: 10s;
        }
        .bg-slide:nth-child(4) {
            background-image: url('https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=1920');
            animation-delay: 15s;
        }

        @keyframes bgFade {
            0%, 18% { opacity: 1; }
            22%, 100% { opacity: 0; }
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(135deg,
                rgba(61, 58, 54, 0.75) 0%,
                rgba(107, 101, 96, 0.6) 50%,
                rgba(61, 58, 54, 0.8) 100%);
            pointer-events: none;
        }

        /* ===== Conteúdo ===== */
        .form-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            animation: cardIn 0.8s ease-out;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card {
            background: rgba(250, 248, 245, 0.97);
            backdrop-filter: blur(20px);
            border-radius: var(--form-radius);
            padding: 2.25rem 2rem;
            box-shadow: var(--form-shadow), 0 0 0 1px rgba(255,255,255,0.5) inset;
            border: 1px solid var(--form-border);
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .form-header .icon-wrap {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            background: linear-gradient(145deg, var(--form-blush), var(--form-warm));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.2);
        }

        .form-header .icon-wrap i {
            font-size: 1.75rem;
            color: var(--form-gold);
        }

        .form-card h1 {
            font-family: var(--font-elegant);
            font-size: 1.85rem;
            font-weight: 600;
            color: var(--form-text);
            margin: 0 0 0.35rem;
            letter-spacing: 0.02em;
        }

        .form-card .sub {
            font-size: 0.95rem;
            color: var(--form-text-soft);
            margin: 0;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 1.1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--form-text-soft);
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }

        .form-card input,
        .form-card select,
        .form-card textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--form-text);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--form-border);
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-card input::placeholder,
        .form-card textarea::placeholder {
            color: #a39e97;
        }

        .form-card input:focus,
        .form-card select:focus,
        .form-card textarea:focus {
            outline: none;
            border-color: var(--form-gold-soft);
            box-shadow: 0 0 0 3px rgba(212, 168, 75, 0.2);
        }

        .form-card textarea {
            resize: vertical;
            min-height: 88px;
        }

        .btn-enviar {
            width: 100%;
            margin-top: 0.5rem;
            padding: 1rem 1.5rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(145deg, var(--form-gold), #9a7309);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.35);
        }

        .btn-enviar:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(184, 134, 11, 0.4);
        }

        .btn-enviar:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        #msg {
            margin-top: 1.25rem;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            font-size: 0.9rem;
            display: none;
        }

        #msg.success {
            background: rgba(46, 204, 113, 0.15);
            color: #1e8449;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }

        #msg.error {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .back-link {
            margin-top: 1.75rem;
            text-align: center;
        }

        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--form-cream);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 0.5rem 0;
            transition: color 0.2s, transform 0.2s;
        }

        .back-link a:hover {
            color: var(--form-gold-soft);
        }
    </style>
</head>
<body>
    <main class="form-page">
        <div class="bg-slides">
            <div class="bg-slide"></div>
            <div class="bg-slide"></div>
            <div class="bg-slide"></div>
            <div class="bg-slide"></div>
        </div>
        <div class="bg-overlay"></div>

        <div class="form-wrap">
            <div class="form-card">
                <div class="form-header">
                    <div class="icon-wrap">
                        <i class="ph ph-heart"></i>
                    </div>
                    <h1>Conte seu evento</h1>
                    <p class="sub">Preencha com carinho e retornaremos em breve para tornar seu dia ainda mais especial.</p>
                </div>

                <form id="formContato">
                    <div class="input-group">
                        <label>Nome completo *</label>
                        <input type="text" id="nome" placeholder="Como podemos te chamar?" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail *</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>WhatsApp *</label>
                        <input type="text" id="whatsapp" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="input-group">
                        <label>Tipo de evento</label>
                        <select id="tipo_evento">
                            <option value="">Selecione...</option>
                            <option value="Casamento">Casamento</option>
                            <option value="Aniversário">Aniversário</option>
                            <option value="Corporativo">Corporativo</option>
                            <option value="Festas">Festas</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Data desejada</label>
                        <input type="date" id="data_desejada">
                    </div>
                    <div class="input-group">
                        <label>Mensagem</label>
                        <textarea id="mensagem" rows="3" placeholder="Conte um pouco sobre o seu evento, o que você imagina..."></textarea>
                    </div>
                    <button type="submit" class="btn-enviar" id="btnEnviar">Enviar</button>
                </form>

                <div id="msg" role="alert"></div>
            </div>

            <div class="back-link">
                <a href="index.html"><i class="ph ph-arrow-left"></i> Voltar ao início</a>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('formContato');
        const msgEl = document.getElementById('msg');
        const btnEnviar = document.getElementById('btnEnviar');

        function showMsg(text, type) {
            msgEl.textContent = text;
            msgEl.className = type;
            msgEl.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando...';
            msgEl.style.display = 'none';

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                email: document.getElementById('email').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim(),
                tipo_evento: document.getElementById('tipo_evento').value || null,
                data_desejada: document.getElementById('data_desejada').value || null,
                mensagem: document.getElementById('mensagem').value.trim() || null
            };

            try {
                const res = await fetch('/.netlify/functions/receber_formulario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.existing) {
                    showMsg(data.message || 'Já temos seu contato. Em breve entraremos em contato!', 'success');
                } else if (data.success) {
                    showMsg(data.message || 'Recebemos seu contato! Em breve entraremos em contato.', 'success');
                    form.reset();
                } else {
                    showMsg(data.error || 'Erro ao enviar. Tente novamente.', 'error');
                }
            } catch (err) {
                showMsg('Erro de conexão. Tente novamente.', 'error');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Enviar';
            }
        });
    </script>
</body>
</html>
