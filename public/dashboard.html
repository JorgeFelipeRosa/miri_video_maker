<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miriã Storymaker | Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/css/components/toast.css">
    <script src="/js/modules/toast.js"></script>
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/global.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/pages/dashboard.css"> 
</head>
<body>

    <div class="app-container">
        
        <div id="sidebar-container"></div>

        <main class="main-content">
            
            <header class="header-std">
                <div class="header-left">
                    <button id="menu-toggle" class="btn-circle-glass" aria-label="Menu"><i class="ph ph-list"></i></button>
                    <div>
                        <h2 class="title-std">Bom dia, Miriã</h2>
                        <p class="header-subtitle">Resumo do dia</p>
                    </div>
                </div>

                <div class="header-right">
                    <div class="date-display" id="headerDate"><span>HOJE</span></div>
                </div>
            </header>

            <div class="kpi-grid">
                <a href="financeiro.html" class="glass-card kpi-card kpi-link" aria-label="Ver faturamento">
                    <div class="kpi-icon"><i class="ph ph-wallet"></i></div>
                    <div class="kpi-info"><span>Faturamento Mês</span><h3 id="kpiFaturamento">R$ 0</h3></div>
                </a>
                <a href="pedidos.html" class="glass-card kpi-card kpi-link" aria-label="Ver pedidos em edição">
                    <div class="kpi-icon warning"><i class="ph ph-clock-countdown"></i></div>
                    <div class="kpi-info"><span>Em Edição</span><h3 id="kpiEdicao">0 Vídeos</h3></div>
                </a>
                <a href="orcamentos.html" class="glass-card kpi-card kpi-link" aria-label="Ver orçamentos abertos">
                    <div class="kpi-icon success"><i class="ph ph-chat-circle-dots"></i></div>
                    <div class="kpi-info"><span>Orçamentos Abertos</span><h3 id="kpiOrcamentos">0 Propostas</h3></div>
                </a>
            </div>

            <div class="quick-action-card glass-card">
                <div class="quick-action-text">
                    <strong class="quick-action-title">Primeiro contato?</strong>
                    <p class="quick-action-desc">Cadastre o cliente para criar propostas e contratos.</p>
                </div>
                <a href="clientes.html" class="btn-primary btn-new" aria-label="Novo cliente"><i class="ph ph-user-plus"></i><span class="desktop-only"> Novo cliente</span></a>
            </div>

            <section class="dashboard-events-section glass-card" aria-labelledby="eventos-semana-title">
                <h3 id="eventos-semana-title" class="dashboard-events-title"><i class="ph ph-calendar-blank"></i> Eventos desta semana</h3>
                <div id="eventosSemanaList" class="dashboard-events-list">
                    <p class="dashboard-events-empty" id="eventosSemanaEmpty">Carregando…</p>
                </div>
                <a href="agenda.html" class="dashboard-events-link">Ver agenda completa</a>
            </section>

        </main>
    </div>

    <script src="/js/utils/format.js"></script>
    <script src="/js/modules/sidebar.js"></script>
    <script type="module" src="/js/controllers/dashboard.js"></script>
</body>
</html>
